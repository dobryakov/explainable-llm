# Корпус для fixture-инструментов (эскиз §3, §7). Детерминированные снапшоты:
# что каждый инструмент возвращает. Идентификаторы (doc_id/row_id/ticket_id)
# — это те самые sources_used, по которым считается source_grounding и абляция.
documents:               # для search_kb
  - id: KB-114
    title: Авто-индексация тарифа при продлении
    text: При продлении договора тариф пересчитывается по годовому индексу. Клиент уведомляется за 30 дней.
