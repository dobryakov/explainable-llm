    title: Общий FAQ по биллингу
    text: Ответы на частые вопросы о счетах, способах оплаты и сроках списания.
  - id: KB-330
    title: Политика возврата при двойном списании
    text: При подтверждённом двойном списании средства возвращаются автоматически в течение 5 рабочих дней.

tickets:                 # для get_ticket
  - id: T-5567
    text: Клиент сообщает о двойном списании 2026-09-10 на одинаковую сумму 1490 руб.

