[project]
name = "exllm-shared"
version = "0.1.0"
description = "Общие контракты (Pydantic-схемы трассы, метрики верности, реестр инструментов) для Explainable-LLM-Agent демо"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exllm_shared"]
