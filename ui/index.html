<!doctype html>
<!-- UI трёх зон (эскиз §8). Зона 1: задачи. Зона 2: ответ + трасса.
     Зона 3: два объяснения, баллы верности, подсветка выдумок/непричинного. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainable LLM Agent</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2029; --line: #2c3542; --fg: #e6edf3;
    --muted: #8b98a5; --accent: #4a9eff; --good: #3fb950; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--fg); }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .wrap { display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 16px; }
  .zone { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .zone h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase;
             letter-spacing: .04em; color: var(--muted); }
  .task { padding: 10px; border: 1px solid var(--line); border-radius: 6px;
          margin-bottom: 8px; cursor: pointer; font-size: 13px; }
  .task:hover { border-color: var(--accent); }
  .task.active { border-color: var(--accent); background: #16202c; }
  .right { display: grid; gap: 16px; }
  .answer { font-size: 15px; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { padding: 8px 0 8px 16px; border-left: 2px solid var(--line);
                 position: relative; }
  .timeline li::before { content: ''; position: absolute; left: -5px; top: 12px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .tool { font-family: ui-monospace, monospace; color: var(--accent); }
  .src { display: inline-block; font-family: ui-monospace, monospace; font-size: 12px;
         background: #16202c; border: 1px solid var(--line); border-radius: 4px;
         padding: 1px 6px; margin: 2px 4px 2px 0; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .score { font-size: 30px; font-weight: 700; }
  .verdict { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
  .v-faithful { background: rgba(63,185,80,.15); color: var(--good); }
  .v-unfaithful { background: rgba(248,81,73,.15); color: var(--bad); }
  .bars { margin: 10px 0; }
  .bar { display: grid; grid-template-columns: 130px 1fr 42px; align-items: center;
         gap: 8px; margin: 4px 0; font-size: 12px; }
  .bar .track { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); }
  .chip { display: inline-block; font-family: ui-monospace, monospace; font-size: 12px;
          padding: 1px 6px; border-radius: 4px; margin: 2px 4px 2px 0; }
  .fab { background: rgba(248,81,73,.15); color: var(--bad); border: 1px solid var(--bad); }
  .unc { background: rgba(210,153,34,.15); color: var(--warn); border: 1px solid var(--warn); }
  .legend { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .gap { font-size: 13px; color: var(--muted); }
  .gap b { color: var(--fg); }
  button { background: var(--accent); color: #06121f; border: 0; border-radius: 6px;
           padding: 8px 14px; font-weight: 600; cursor: pointer; }
  .muted { color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre { background: #0b1017; border: 1px solid var(--line); border-radius: 6px;
        padding: 10px; overflow: auto; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>Explainable LLM Agent — верность объяснений</h1>
  <p>Правдоподобное объяснение ≠ верное. Сверяем объяснение агента с его реальным следом выполнения.</p>
</header>

<div class="wrap">
  <!-- Зона 1 -->
  <div class="zone" id="zone1">
    <h2>Задачи</h2>
    <div id="tasks" class="muted">загрузка…</div>
  </div>

  <div class="right">
    <!-- Зона 2 -->
    <div class="zone" id="zone2">
      <h2>Ответ агента и трасса</h2>
      <div id="answer" class="muted">Выберите задачу слева.</div>
    </div>

    <!-- Зона 3 -->
    <div class="zone" id="zone3">
      <h2>Два объяснения и верность</h2>
      <div id="explanations" class="muted">—</div>
    </div>
  </div>
</div>

<script>
const $ = (s, r=document) => r.querySelector(s);
let TASKS = [];

async function loadTasks() {
  const r = await fetch('/v1/tasks'); const d = await r.json();
  TASKS = d.tasks;
  const box = $('#tasks'); box.innerHTML = '';
  TASKS.forEach(t => {
    const el = document.createElement('div');
    el.className = 'task'; el.textContent = t.task;
    el.onclick = () => { selectTask(t, el); };
    box.appendChild(el);
  });
}

async function selectTask(t, el) {
  document.querySelectorAll('.task').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  $('#answer').innerHTML = '<span class="muted">анализ…</span>';
  $('#explanations').innerHTML = '<span class="muted">анализ…</span>';
  const r = await fetch('/v1/analyze', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({task: t.task})});
  if (!r.ok) { $('#answer').textContent = 'Ошибка анализа'; return; }
  render(await r.json());
}

function renderTrace(trace) {
  const steps = trace.steps.map(s => {
    const tool = s.tool_name ? `<span class="tool">${s.tool_name}</span>` : `<i>${s.type}</i>`;
    const src = (s.retrieved_ids || []).map(id => `<span class="src">${id}</span>`).join('');
    return `<li>${tool} ${s.type === 'tool_result' ? '→ ' + src : ''}</li>`;
  }).join('');
  const sources = (trace.sources_used || []).map(id => `<span class="src">${id}</span>`).join('');
  return `<div class="answer">${trace.final_answer}</div>
    <h2 style="margin-top:14px">Трасса выполнения</h2>
    <ul class="timeline">${steps}</ul>
    <div><span class="muted">sources_used:</span> ${sources}</div>`;
}

function bar(label, v) {
  return `<div class="bar"><span>${label}</span>
    <span class="track"><span class="fill" style="width:${Math.round(v*100)}%"></span></span>
    <span>${v.toFixed(2)}</span></div>`;
}

function card(mode, m) {
  const f = m.faithfulness, c = f.components;
  const fabSteps = (f.fabricated_steps || []).map(x => `<span class="chip fab">${x}</span>`).join('');
  const fabSrc = (f.fabricated_sources || []).map(x => `<span class="chip fab">${x}</span>`).join('');
  const unc = (f.uncausal_claims || []).map(x => `<span class="chip unc">${x}</span>`).join('');
  const steps = (m.narration.claimed_steps || []).map(s => `<span class="src">${s.tool_name}</span>`).join('');
  return `<div class="card">
    <h3>${mode === 'blind' ? 'blind (без трассы)' : 'grounded (по трассе)'}</h3>
    <div><span class="score">${f.score.toFixed(0)}</span>
      <span class="verdict ${f.verdict==='faithful'?'v-faithful':'v-unfaithful'}">${f.verdict}</span></div>
    <div class="bars">
      ${bar('step_coverage', c.step_coverage)}
      ${bar('step_precision', c.step_precision)}
      ${bar('source_grounding', c.source_grounding)}
      ${bar('causal_validity', c.causal_validity)}
    </div>
    <div><span class="muted">заявленные шаги:</span> ${steps || '—'}</div>
    ${fabSteps || fabSrc ? `<div style="margin-top:6px"><span class="muted">выдумано:</span> ${fabSteps} ${fabSrc}</div>` : ''}
    ${unc ? `<div style="margin-top:6px"><span class="muted">не подтверждено абляцией:</span> ${unc}</div>` : ''}
    <div style="margin-top:6px" class="muted">fabrication_rate: ${f.fabrication_rate.toFixed(2)}</div>
    <details style="margin-top:8px"><summary>narrative</summary><div style="margin-top:6px">${m.narration.narrative_ru}</div></details>
  </div>`;
}

function render(data) {
  $('#answer').innerHTML = renderTrace(data.trace);
  $('#explanations').innerHTML =
    `<div class="cols">${card('blind', data.modes.blind)}${card('grounded', data.modes.grounded)}</div>
     <div class="gap" style="margin-top:12px">Разрыв верности grounded − blind: <b>${data.gap}</b> баллов</div>
     <div class="legend"><span class="chip fab">красный</span> — шаг/источник, которого нет в трассе (галлюцинация).
       <span class="chip unc">оранжевый</span> — заявленная причина не подтверждена абляцией.</div>
     <details style="margin-top:10px"><summary>сырой JSON трассы</summary><pre>${JSON.stringify(data.trace, null, 2)}</pre></details>`;
}

loadTasks();
</script>
</body>
</html>
